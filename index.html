<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board</title>
<style>
/* ==========================================================
   Design tokens: palette + spacing scale (CSS custom properties)
   ========================================================== */
:root {
  --blue-900: #0b2545;
  --blue-700: #13408a;
  --blue-600: #1a56b0;
  --blue-100: #dce8f8;
  --blue-50:  #f0f5fc;
  --grey-900: #1d2430;
  --grey-600: #5b6573;
  --grey-400: #9aa3af;
  --grey-200: #dfe3e8;
  --grey-100: #eef0f3;
  --white: #ffffff;
  --red: #c62828;
  --red-bg: #fdeaea;
  --amber: #e08a00;
  --amber-bg: #fff3dc;
  --green: #1b7a43;
  --green-bg: #e2f4ea;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--font); color: var(--grey-900);
  background: var(--blue-50); line-height: 1.4; font-size: 14px;
}
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- Header ---------- */
.app-header {
  background: var(--blue-900); color: var(--white);
  padding: var(--sp-3) var(--sp-5);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4);
}
.wordmark { font-size: 22px; font-weight: 800; letter-spacing: 1px; margin: 0; }
.wordmark span { font-weight: 400; opacity: .8; font-size: 14px; letter-spacing: 0; margin-left: var(--sp-2); }
.summary { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0; padding: 0; list-style: none; flex: 1; }
.summary li {
  background: rgba(255,255,255,.12); border-radius: var(--radius);
  padding: var(--sp-1) var(--sp-3); font-size: 12px;
}
.summary strong { font-size: 16px; margin-right: var(--sp-1); }
.summary .overdue-stat { background: var(--red); }
.btn {
  border: 1px solid var(--blue-600); background: var(--blue-600); color: var(--white);
  border-radius: var(--radius); padding: var(--sp-2) var(--sp-4); font-weight: 600;
}
.btn:hover { background: var(--blue-700); }
.btn[disabled] { opacity: .65; cursor: progress; }
.btn-secondary { background: var(--white); color: var(--blue-700); }
.btn-secondary:hover { background: var(--blue-100); }
.app-header .btn { background: var(--white); color: var(--blue-900); border-color: var(--white); }
.app-header .btn:hover { background: var(--blue-100); }

/* ---------- Filters ---------- */
.filters {
  display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: end;
  padding: var(--sp-3) var(--sp-5); background: var(--white); border-bottom: 1px solid var(--grey-200);
}
.filters label { display: block; font-size: 12px; color: var(--grey-600); margin-bottom: var(--sp-1); }
.filters select, .filters input { min-width: 170px; }
.note { margin-left: auto; font-size: 12px; color: var(--grey-600); max-width: 340px; }

/* ---------- Board ---------- */
main { padding: var(--sp-4) var(--sp-5); }
.board { display: flex; gap: var(--sp-4); align-items: flex-start; }
.column {
  flex: 1 1 0; min-width: 0; background: var(--blue-100);
  border: 2px solid transparent; border-radius: var(--radius); padding: var(--sp-3);
  min-height: 160px;
}
.column.drop-target { border-color: var(--blue-600); background: #c9dcf5; border-style: dashed; }
.column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-3); }
.column-header h2 { margin: 0; font-size: 15px; color: var(--blue-900); }
.column-header p { margin: 0; font-size: 11px; color: var(--grey-600); }
.badge {
  background: var(--blue-700); color: var(--white); border-radius: 999px;
  min-width: 24px; text-align: center; padding: 1px var(--sp-2); font-size: 12px; font-weight: 700;
}
.cards { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 60px; }
.empty { color: var(--grey-600); font-size: 12px; text-align: center; padding: var(--sp-4); }

/* ---------- Card ---------- */
.card {
  background: var(--white); border-radius: var(--radius); border-left: 6px solid var(--grey-400);
  padding: var(--sp-3); box-shadow: 0 1px 2px rgba(11,37,69,.15); cursor: grab; position: relative;
}
.card.dragging { opacity: .45; }
.card.p-critical { border-left-color: var(--red); }
.card.p-high { border-left-color: var(--amber); }
.card.p-medium { border-left-color: var(--blue-600); }
.card.p-low { border-left-color: var(--grey-400); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
.card-id { font-size: 11px; font-weight: 700; color: var(--grey-600); font-family: ui-monospace, Consolas, monospace; }
.card h3 { margin: var(--sp-1) 0; font-size: 14px; overflow-wrap: anywhere; }
.card .meta { font-size: 12px; color: var(--grey-600); margin: 2px 0; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-2) 0; }
.pill, .tag, .overdue {
  font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px var(--sp-2); display: inline-block;
}
.pill-critical { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.pill-high { background: var(--amber-bg); color: #8a5300; border: 1px solid var(--amber); }
.pill-medium { background: var(--blue-100); color: var(--blue-700); border: 1px solid var(--blue-600); }
.pill-low { background: var(--grey-100); color: var(--grey-600); border: 1px solid var(--grey-400); }
.tag { background: var(--white); color: var(--blue-900); border: 1px solid var(--grey-200); font-weight: 600; }
.overdue { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.card-actions { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
.card-actions select { font-size: 12px; padding: 2px var(--sp-1); max-width: 110px; }
.icon-btn {
  border: 1px solid transparent; background: transparent; color: var(--grey-600);
  font-size: 18px; line-height: 1; border-radius: var(--radius); padding: 2px var(--sp-2);
}
.icon-btn:hover { background: var(--red-bg); color: var(--red); }
.confirm { display: flex; align-items: center; gap: var(--sp-1); font-size: 12px; color: var(--red); font-weight: 600; }
.confirm button { font-size: 12px; padding: 2px var(--sp-2); border-radius: var(--radius); border: 1px solid var(--red); background: var(--white); color: var(--red); }
.confirm button.yes { background: var(--red); color: var(--white); }

/* ---------- Modal + form ---------- */
dialog { border: none; border-radius: var(--radius); padding: 0; width: min(560px, 94vw); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(11,37,69,.55); }
.modal-head { background: var(--blue-900); color: var(--white); padding: var(--sp-3) var(--sp-4); display: flex; justify-content: space-between; align-items: center; }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-head .icon-btn { color: var(--white); }
.modal-head .icon-btn:hover { background: rgba(255,255,255,.15); color: var(--white); }
form { padding: var(--sp-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); max-height: 80vh; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: var(--sp-1); }
.field.full { grid-column: 1 / -1; }
.field label { font-weight: 600; font-size: 13px; }
.req { color: var(--red); }
.field input, .field select, .field textarea {
  border: 1px solid var(--grey-400); border-radius: var(--radius); padding: var(--sp-2); background: var(--white);
}
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); background: var(--red-bg); }
.error { color: var(--red); font-size: 12px; min-height: 0; margin: 0; }
.hint { font-size: 11px; color: var(--grey-600); }
.form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); }

/* ---------- Toasts ---------- */
.toast-region { position: fixed; right: var(--sp-4); bottom: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); z-index: 50; max-width: 360px; }
.toast { padding: var(--sp-3) var(--sp-4); border-radius: var(--radius); color: var(--white); box-shadow: 0 4px 14px rgba(0,0,0,.25); font-weight: 600; }
.toast-success { background: var(--green); }
.toast-warning { background: var(--amber); color: var(--grey-900); }
.toast-info { background: var(--blue-700); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Responsive: stack columns below 768px ---------- */
@media (max-width: 767px) {
  .board { flex-direction: column; align-items: stretch; }
  .column { flex: none; }
  form { grid-template-columns: 1fr; }
  .note { margin-left: 0; max-width: none; }
  main, .filters, .app-header { padding-left: var(--sp-3); padding-right: var(--sp-3); }
}
</style>
</head>
<body>

<!-- ===== Header: wordmark, live summary strip, Add Task button ===== -->
<header class="app-header">
  <h1 class="wordmark">IT PMO <span>Project Board · demo</span></h1>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <button type="button" class="btn" id="openAdd">+ Add Task</button>
</header>

<!-- ===== Filter bar ===== -->
<section class="filters" aria-label="Filters">
  <div>
    <label for="fProject">Project</label>
    <select id="fProject"></select>
  </div>
  <div>
    <label for="fAssignee">Assignee contains</label>
    <input type="text" id="fAssignee" placeholder="e.g. Tan">
  </div>
  <div>
    <label for="fPriority">Priority</label>
    <select id="fPriority"></select>
  </div>
  <button type="button" class="btn btn-secondary" id="clearFilters">Clear</button>
  <p class="note">Demo only: nothing is saved. Refreshing the page resets the board to the seeded demo data.</p>
</section>

<!-- ===== Kanban board (rendered by renderBoard) ===== -->
<main>
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- ===== Add Task modal ===== -->
<dialog id="addDialog" aria-labelledby="addTitle">
  <div class="modal-head">
    <h2 id="addTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeAdd" aria-label="Close add task form">&times;</button>
  </div>
  <form id="taskForm" novalidate>
    <div class="field full" data-field="title">
      <label for="title">Task Title <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="title" maxlength="80" autocomplete="off" aria-describedby="title-err">
      <p class="error" id="title-err"></p>
    </div>
    <div class="field full" data-field="description">
      <label for="description">Description</label>
      <textarea id="description" rows="3" maxlength="500" aria-describedby="description-err"></textarea>
      <span class="hint">Max 500 characters</span>
      <p class="error" id="description-err"></p>
    </div>
    <div class="field" data-field="project">
      <label for="project">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
      <select id="project" aria-describedby="project-err"></select>
      <p class="error" id="project-err"></p>
    </div>
    <div class="field" data-field="category">
      <label for="category">Category <span class="req" aria-hidden="true">*</span></label>
      <select id="category" aria-describedby="category-err"></select>
      <p class="error" id="category-err"></p>
    </div>
    <div class="field" data-field="assignee">
      <label for="assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="assignee" maxlength="60" autocomplete="off" aria-describedby="assignee-err">
      <p class="error" id="assignee-err"></p>
    </div>
    <div class="field" data-field="priority">
      <label for="priority">Priority</label>
      <select id="priority" aria-describedby="priority-err"></select>
      <p class="error" id="priority-err"></p>
    </div>
    <div class="field" data-field="dueDate">
      <label for="dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
      <input type="date" id="dueDate" aria-describedby="dueDate-err">
      <p class="error" id="dueDate-err"></p>
    </div>
    <div class="field" data-field="status">
      <label for="status">Status</label>
      <select id="status" aria-describedby="status-err"></select>
      <p class="error" id="status-err"></p>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="cancelAdd">Cancel</button>
      <button type="submit" class="btn" id="submitBtn">Add Task</button>
    </div>
  </form>
</dialog>

<!-- ===== Toast region (aria-live) ===== -->
<div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!--
  FORMSUBMIT ACTIVATION NOTE
  FormSubmit needs a one-time activation: the FIRST submission to a new email address
  triggers a confirmation email to that address. Submissions are only delivered after
  the activation link in that email has been clicked.
-->
<script>
"use strict";

/* ==========================================================
   CONFIG – change the email address here (only place it appears)
   ========================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* ==========================================================
   Constants
   ========================================================== */
const STATUSES   = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_DESC = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on a dependency, vendor or approval",
  "Done": "Completed / closed"
};
const PROJECTS   = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ==========================================================
   State – single source of truth (in memory only, no storage APIs)
   ========================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  ui: { confirmDeleteId: null, focusSelector: null, nextId: 1 }
};

/* ---------- Date helpers (local time, ISO yyyy-mm-dd) ---------- */
function toISODate(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function todayISO() { return toISODate(new Date()); }
function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return toISODate(d);
}
function isOverdue(task) { return task.status !== "Done" && task.dueDate < todayISO(); }

/* ---------- Escape helper: every user string passes through this ---------- */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ==========================================================
   Seed data (demo only; dates relative to today so Overdue shows)
   ========================================================== */
function makeId() {
  const id = "UOB-ITPM-" + String(state.ui.nextId).padStart(4, "0");
  state.ui.nextId += 1;
  return id;
}
function seedTasks() {
  const seeds = [
    ["Migrate FX pricing service to AWS", "Lift and shift the FX pricing engine with parallel run.", "Infrastructure & Cloud", "Infrastructure", "Wei Ling Tan", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to all branch teller VDI images.", "Cybersecurity Uplift", "Cybersecurity", "Arjun Mehta", "Critical", -3, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for release 4.2.", "Digital Channels", "Application Development", "Priya Nair", "High", 5, "Blocked"],
    ["Core ledger upgrade impact assessment", "Assess interfaces affected by the v12 core ledger upgrade.", "Core Banking Upgrade", "Application Development", "Daniel Lim", "Medium", 30, "Backlog"],
    ["Renew data lake vendor support contract", "Negotiate renewal and SLA terms.", "Vendor Management", "Vendor", "Sarah Koh", "Low", 45, "Backlog"],
    ["Quarterly access recertification evidence pack", "Compile evidence for internal audit.", "Cybersecurity Uplift", "Compliance", "Arjun Mehta", "Medium", -7, "Blocked"],
    ["Customer churn dashboard v2", "Add cohort views to the analytics dashboard.", "Data & Analytics", "Data", "Marcus Ong", "Medium", 14, "In Progress"],
    ["Decommission legacy SFTP gateway", "Final cutover completed and gateway powered off.", "Infrastructure & Cloud", "Infrastructure", "Wei Ling Tan", "Low", -10, "Done"]
  ];
  return seeds.map(function (s) {
    return { id: makeId(), title: s[0], description: s[1], project: s[2], category: s[3],
             assignee: s[4], priority: s[5], dueDate: offsetDate(s[6]), status: s[7] };
  });
}

/* ==========================================================
   Filtering
   ========================================================== */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    return (!f.project || t.project === f.project) &&
           (!f.priority || t.priority === f.priority) &&
           (!needle || t.assignee.toLowerCase().indexOf(needle) !== -1);
  });
}

/* ==========================================================
   Rendering – all card/column DOM comes from here
   ========================================================== */
function renderCard(task) {
  const pKey = task.priority.toLowerCase();
  const confirming = state.ui.confirmDeleteId === task.id;
  const moveOptions = STATUSES.filter(function (s) { return s !== task.status; })
    .map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join("");

  const deleteArea = confirming
    ? '<span class="confirm" role="group" aria-label="Confirm delete ' + escapeHtml(task.id) + '">Delete? ' +
      '<button type="button" class="yes" data-action="delete-yes" data-id="' + escapeHtml(task.id) + '">Yes</button>' +
      '<button type="button" data-action="delete-no" data-id="' + escapeHtml(task.id) + '">No</button></span>'
    : '<button type="button" class="icon-btn" data-action="delete-ask" data-id="' + escapeHtml(task.id) +
      '" aria-label="Delete task ' + escapeHtml(task.id) + '">&times;</button>';

  return '<article class="card p-' + pKey + '" draggable="true" data-id="' + escapeHtml(task.id) + '">' +
    '<div class="card-top"><span class="card-id">' + escapeHtml(task.id) + '</span>' +
    (isOverdue(task) ? '<span class="overdue">Overdue</span>' : '') + '</div>' +
    '<h3>' + escapeHtml(task.title) + '</h3>' +
    '<p class="meta">&#9638; ' + escapeHtml(task.project) + '</p>' +
    '<p class="meta">&#9786; ' + escapeHtml(task.assignee) + '</p>' +
    '<p class="meta">&#128197; Due ' + escapeHtml(task.dueDate) + '</p>' +
    '<div class="tags"><span class="pill pill-' + pKey + '">' + escapeHtml(task.priority) + '</span>' +
    '<span class="tag">' + escapeHtml(task.category) + '</span></div>' +
    '<div class="card-actions">' +
      '<select data-action="move" data-id="' + escapeHtml(task.id) + '" aria-label="Move task ' + escapeHtml(task.id) + ' to another column">' +
      '<option value="">Move &#9656;</option>' + moveOptions + '</select>' +
      deleteArea +
    '</div></article>';
}

function renderSummary() {
  const all = state.tasks;
  const parts = ['<li><strong>' + all.length + '</strong>Total</li>'];
  STATUSES.forEach(function (s) {
    const n = all.filter(function (t) { return t.status === s; }).length;
    parts.push('<li><strong>' + n + '</strong>' + escapeHtml(s) + '</li>');
  });
  const od = all.filter(isOverdue).length;
  parts.push('<li class="overdue-stat"><strong>' + od + '</strong>Overdue</li>');
  document.getElementById("summary").innerHTML = parts.join("");
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const html = STATUSES.map(function (status) {
    const cards = visible.filter(function (t) { return t.status === status; });
    return '<section class="column" data-status="' + escapeHtml(status) + '" aria-label="' + escapeHtml(status) + ' column">' +
      '<div class="column-header"><div><h2>' + escapeHtml(status) + '</h2><p>' + escapeHtml(STATUS_DESC[status]) + '</p></div>' +
      '<span class="badge" aria-label="' + cards.length + ' tasks">' + cards.length + '</span></div>' +
      '<div class="cards">' + (cards.length ? cards.map(renderCard).join("") : '<p class="empty">No tasks</p>') + '</div></section>';
  }).join("");
  document.getElementById("board").innerHTML = html;
  renderSummary();

  // Restore keyboard focus after a re-render
  if (state.ui.focusSelector) {
    const el = document.querySelector(state.ui.focusSelector);
    if (el) el.focus();
    state.ui.focusSelector = null;
  }
}

/* ==========================================================
   Actions: add / move / delete
   ========================================================== */
function addTask(task) {
  state.tasks.push(task);
  renderBoard();
}

function moveTask(id, newStatus) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || STATUSES.indexOf(newStatus) === -1 || task.status === newStatus) return;
  task.status = newStatus;
  state.ui.focusSelector = '.card[data-id="' + id + '"] select';
  renderBoard();
  showToast(id + " moved to " + newStatus, "info");
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.ui.confirmDeleteId = null;
  renderBoard();
  showToast(id + " deleted", "info");
}

/* ==========================================================
   Toasts
   ========================================================== */
function showToast(message, kind) {
  const region = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast toast-" + (kind || "info");
  el.textContent = message;               // textContent: safe by construction
  region.appendChild(el);
  setTimeout(function () { el.remove(); }, kind === "warning" ? 6000 : 3500);
}

/* ==========================================================
   FormSubmit notification (AJAX JSON endpoint)
   ========================================================== */
async function notifyNewTask(task) {
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, 15000);
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString()
      })
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ==========================================================
   Form: build selects, validate, submit
   ========================================================== */
function fillSelect(id, values, placeholder, selected) {
  const sel = document.getElementById(id);
  const opts = [];
  if (placeholder !== null) opts.push('<option value="">' + escapeHtml(placeholder) + '</option>');
  values.forEach(function (v) {
    opts.push('<option value="' + escapeHtml(v) + '"' + (v === selected ? " selected" : "") + '>' + escapeHtml(v) + '</option>');
  });
  sel.innerHTML = opts.join("");
}

function readForm() {
  const v = function (id) { return document.getElementById(id).value.trim(); };
  return { title: v("title"), description: v("description"), project: v("project"), category: v("category"),
           assignee: v("assignee"), priority: v("priority"), dueDate: v("dueDate"), status: v("status") };
}

function validate(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!data.project) errors.project = "Please choose a project.";
  if (!data.category) errors.category = "Please choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (PRIORITIES.indexOf(data.priority) === -1) errors.priority = "Please choose a priority.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date must not be in the past.";
  if (STATUSES.indexOf(data.status) === -1) errors.status = "Please choose a status.";
  return errors;
}

function showErrors(errors) {
  document.querySelectorAll("#taskForm .field").forEach(function (field) {
    const key = field.getAttribute("data-field");
    const msg = errors[key] || "";
    field.classList.toggle("invalid", !!msg);
    field.querySelector(".error").textContent = msg;
    const input = field.querySelector("input, select, textarea");
    if (msg) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  });
  const first = Object.keys(errors)[0];
  if (first) document.getElementById(first).focus();
}

function resetForm() {
  document.getElementById("taskForm").reset();
  fillSelect("project", PROJECTS, "Select a project…", "");
  fillSelect("category", CATEGORIES, "Select a category…", "");
  fillSelect("priority", PRIORITIES, null, "Medium");
  fillSelect("status", STATUSES, null, "Backlog");
  showErrors({});
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  const errors = validate(data);
  showErrors(errors);
  if (Object.keys(errors).length) return;

  const btn = document.getElementById("submitBtn");
  const task = Object.assign({ id: makeId() }, data);

  addTask(task);                 // optimistic: card appears immediately
  resetForm();
  showToast("Task " + task.id + " added", "success");

  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warning");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
    document.getElementById("addDialog").close();
  }
}

/* ==========================================================
   Modal open/close
   ========================================================== */
function openAddDialog() {
  const dlg = document.getElementById("addDialog");
  document.getElementById("dueDate").min = todayISO();
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  document.getElementById("title").focus();
}

/* ==========================================================
   Drag and drop (native HTML5 DnD, delegated on the board)
   ========================================================== */
let draggedId = null;

function clearDropTargets() {
  document.querySelectorAll(".column.drop-target").forEach(function (c) { c.classList.remove("drop-target"); });
}

function initDragAndDrop() {
  const board = document.getElementById("board");

  board.addEventListener("dragstart", function (e) {
    const card = e.target.closest && e.target.closest(".card");
    if (!card) return;
    draggedId = card.getAttribute("data-id");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggedId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", function (e) {
    const card = e.target.closest && e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    draggedId = null;
    clearDropTargets();
  });
  board.addEventListener("dragover", function (e) {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();                       // allow drop
    e.dataTransfer.dropEffect = "move";
    if (!col.classList.contains("drop-target")) { clearDropTargets(); col.classList.add("drop-target"); }
  });
  board.addEventListener("dragleave", function (e) {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", function (e) {
    const col = e.target.closest(".column");
    if (!col || !draggedId) return;
    e.preventDefault();
    const id = draggedId;
    draggedId = null;
    clearDropTargets();
    moveTask(id, col.getAttribute("data-status"));
  });
}

/* ==========================================================
   Wiring: events and initial render
   ========================================================== */
function initBoardActions() {
  const board = document.getElementById("board");
  board.addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    if (action === "delete-ask") {
      state.ui.confirmDeleteId = id;
      state.ui.focusSelector = '.card[data-id="' + id + '"] [data-action="delete-no"]';
      renderBoard();
    } else if (action === "delete-no") {
      state.ui.confirmDeleteId = null;
      state.ui.focusSelector = '.card[data-id="' + id + '"] [data-action="delete-ask"]';
      renderBoard();
    } else if (action === "delete-yes") {
      deleteTask(id);
    }
  });
  board.addEventListener("change", function (e) {
    const sel = e.target.closest("select[data-action='move']");
    if (sel && sel.value) moveTask(sel.getAttribute("data-id"), sel.value);
  });
}

function initFilters() {
  fillSelect("fProject", PROJECTS, "All projects", "");
  fillSelect("fPriority", PRIORITIES, "All priorities", "");
  const sync = function () {
    state.filters.project = document.getElementById("fProject").value;
    state.filters.priority = document.getElementById("fPriority").value;
    state.filters.assignee = document.getElementById("fAssignee").value;
    renderBoard();
  };
  document.getElementById("fProject").addEventListener("change", sync);
  document.getElementById("fPriority").addEventListener("change", sync);
  document.getElementById("fAssignee").addEventListener("input", sync);
  document.getElementById("clearFilters").addEventListener("click", function () {
    document.getElementById("fProject").value = "";
    document.getElementById("fPriority").value = "";
    document.getElementById("fAssignee").value = "";
    sync();
  });
}

function init() {
  state.tasks = seedTasks();
  initFilters();
  resetForm();
  initDragAndDrop();
  initBoardActions();
  document.getElementById("openAdd").addEventListener("click", openAddDialog);
  document.getElementById("closeAdd").addEventListener("click", function () { document.getElementById("addDialog").close(); });
  document.getElementById("cancelAdd").addEventListener("click", function () { document.getElementById("addDialog").close(); });
  document.getElementById("taskForm").addEventListener("submit", handleSubmit);
  renderBoard();
}

init();
</script>
